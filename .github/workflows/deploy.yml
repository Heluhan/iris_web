name: Scrape and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # every Monday 13:00 UTC (8–9am US Eastern)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Refresh openings from the firms' job boards; if the scrape fails entirely,
      # the committed public/openings.json is used instead.
      - name: Scrape openings
        run: npm run scrape
        continue-on-error: true
        timeout-minutes: 10
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
